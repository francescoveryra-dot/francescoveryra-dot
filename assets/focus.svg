<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 62" width="500" height="62" role="img" aria-labelledby="t d" font-family="'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
